{% extends 'base.html' %}

{% block title %}Sign Up | Myntra{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 80px); display: flex; justify-content: center; align-items: center; background-color: #fdf0f3; padding: 40px 20px;">
    <div style="background: #ffffff; width: 100%; max-width: 400px; padding: 40px 35px; border-radius: 4px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);">
        <h2 style="font-size: 20px; font-weight: 800; color: #282c3f; margin-bottom: 6px;">Sign Up</h2>
        <p style="font-size: 13px; color: #878b94; margin-bottom: 25px;">Create an account to begin shopping</p>

        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 12px; font-weight: 700; color: #282c3f; margin-bottom: 4px;">{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" required style="width: 100%; padding: 10px 12px; border: 1px solid #d4d5d9; border-radius: 2px; font-size: 14px; outline: none;">
                    {% if field.errors %}
                        <div style="color: #d32f2f; font-size: 12px; margin-top: 4px;">{{ field.errors.0 }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" style="width: 100%; padding: 12px; background-color: #ff3f6c; color: #ffffff; border: none; font-size: 14px; font-weight: 700; border-radius: 2px; cursor: pointer; margin-top: 10px;">REGISTER</button>
        </form>

        <p style="font-size: 13px; text-align: center; color: #535766; margin-top: 22px;">
            Already have an account? <a href="{% url 'login' %}" style="color: #ff3f6c; font-weight: 700; text-decoration: none;">Login</a>
        </p>
    </div>
</div>
{% endblock %}
